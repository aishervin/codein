name: Rebuild and replace v1.0.5 APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-v105.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          [[ -x "$SDKMANAGER" ]] || { echo "Android sdkmanager was not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore existing release signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codein-release.jks"

      - name: Build signed APK with update-compatible version code
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/codein-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          bash ./gradlew assembleRelease --no-daemon --stacktrace --console=plain -PversionName=1.0.5 -PversionCode=13

      - name: Rename APK to the existing release asset name
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Codein-Agent+-Universal.apk"

      - name: Publish replacement to existing v1.0.5 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: Codein v1.0.5
          generate_release_notes: false
          files: app/build/outputs/apk/release/Codein-Agent+-Universal.apk
