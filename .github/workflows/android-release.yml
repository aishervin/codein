name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.1"
        type: string
      version_name:
        description: "Android versionName; leave empty to derive it from the tag"
        required: false
        default: ""
        type: string
      version_code:
        description: "Integer versionCode; must increase for every update"
        required: true
        default: "10"
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          [[ -x "$SDKMANAGER" ]] || { echo "Android sdkmanager was not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release values
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          [[ "$TAG" == v* ]] || { echo "Tag must start with v: $TAG"; exit 1; }
          VERSION_NAME="${INPUT_VERSION_NAME:-${TAG#v}}"
          VERSION_CODE="${INPUT_VERSION_CODE:-${GITHUB_RUN_NUMBER}}"
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "version_code must be an integer"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codein-release.jks"

      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/codein-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          bash ./gradlew assembleRelease --no-daemon --stacktrace --console=plain -PversionName="${{ steps.release.outputs.version_name }}" -PversionCode="${{ steps.release.outputs.version_code }}" 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codein-gradle-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore

      - name: Rename release APK
        shell: bash
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Codein-${{ steps.release.outputs.version_name }}-Universal.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codein-${{ steps.release.outputs.tag }}
          path: app/build/outputs/apk/release/Codein-${{ steps.release.outputs.version_name }}-Universal.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Codein ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
          files: app/build/outputs/apk/release/Codein-${{ steps.release.outputs.version_name }}-Universal.apk
