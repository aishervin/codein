<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">CODΞiN™ — SHΞN™ Coder</title>
  <desc id="desc">The original SHΞN emblem with a warm orange, animated neural-circuit schematic on a charcoal field.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101012"/>
      <stop offset="0.55" stop-color="#17130f"/>
      <stop offset="1" stop-color="#0d0e10"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
